name: Verify new Tokens

on:
  pull_request:
  workflow_dispatch:
    branches:
      - main   
jobs:
  verify-new-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      - name: Run verify tokens script
        run: yarn verify
