name: Unit Tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/test.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test
