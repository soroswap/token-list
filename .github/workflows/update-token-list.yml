name: Update Token List

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none
  
jobs:
  update-token-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      # The baseline is main before this push, not the checked-out file: a contributor fork
      # with Actions enabled commits its own tokenList.json into the PR, so the merged file
      # can already contain the new token and nothing would be announced.
      - name: Keep the list as it was before the push
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git fetch --quiet --depth=1 origin "$BEFORE_SHA" \
            && git show "$BEFORE_SHA:tokenList.json" > "$RUNNER_TEMP/tokenList.before.json"; then
            echo "Baseline: tokenList.json at $BEFORE_SHA"
          else
            echo "::warning::Could not read tokenList.json at '$BEFORE_SHA'; using the checked-out file as baseline"
            cp tokenList.json "$RUNNER_TEMP/tokenList.before.json"
          fi

      - name: Run merge script
        run: yarn merge

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update tokenList.json"
          commit_options: '-a'  # Include changes to all tracked files
          branch: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Public announcement of tokens added by this push. Edits are not announced, and a
      # Discord failure must not block the trustlines step below.
      - name: Announce new tokens on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_TOKEN_LIST_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].html_url // empty' || true)
          export PR_URL
          node scripts/announceNewTokens.js "$RUNNER_TEMP/tokenList.before.json" tokenList.json

      - name: Set new trustlines
        run: yarn set-trustlines ${{ secrets.TRUSTLINES_PRIVATE_KEY }}
