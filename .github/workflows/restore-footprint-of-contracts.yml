name: Restore Footprint of Token Contracts

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 01:07 UTC
    - cron: "7 1 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install

      - name: Run restoreFootprintOfTokenContracts.js script
        run: yarn restore-footprints
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          HORIZON_URL: ${{ secrets.HORIZON_URL || 'https://horizon.stellar.org' }}
          SOROSWAP_API_KEY: ${{ secrets.SOROSWAP_API_KEY }}
